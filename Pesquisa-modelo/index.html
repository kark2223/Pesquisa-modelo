<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Form_icon.png" type="image/png">
    <title>Document</title>
</head>
<body>
   <header>
        <h1>Pesquisa Modelo</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>
            <label for="userName">Nome:</label>
            <input type="text" id="userName" name="userName" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="userage">Idade:</label>
            <input type="number" id="userage" name="userage" min="18" max="150" required><br><br>

            <label for="birthDate">Data de Nascimento:</label>
            <input type="date" id="birthDate" name="birthDate"><br><br>
            
            <label for="genero">Gênero:</label>
            <select id="genero" name="genero" required>
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select><br><br>

            <label for="userPhoneNumber" >Telefone:</label>
            <input type="tel" id="userPhoneNumber" name="userPhoneNumber" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" placeholder="XX-XXXXX-XXXX" maxlength="13" required><br><br>

            <label type="file" for="userImage">Upload de foto:</label>
            <input type="file" id="userImage" name="userImage" accept=".jpg, .jpeg, .png, .pdf"><br><br>


            <input type="submit" value="Enviar">
        </fieldset>
        </form>
    </section> 
</body>
</html>
